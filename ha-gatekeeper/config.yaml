name: "HA Gatekeeper"
version: "2.1.0"
slug: ha-gatekeeper
description: "Passworded, per-user links that trigger a Home Assistant binary_sensor without giving visitors a real HA login"
url: "https://github.com/yourname/ha-addons"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Web UI / login portal"
options:
  users: []
  session_days: 365
  cookie_secure: true
  success_message: "Action triggered ✅"
  error_message: "Error. Notify an admin."
  login_footer_text: ""
schema:
  users:
    - name: str
      password: password
  session_days: int
  cookie_secure: bool
  success_message: str
  error_message: str
  login_footer_text: str
