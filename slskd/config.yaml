---
name: "slskd"
version: "0.26.0"
slug: "slskd"
description: "A modern, self-hosted web client for the Soulseek peer-to-peer file-sharing network, with optional WireGuard VPN"
url: "https://github.com/Xornop/ha-apps/tree/main/slskd"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
apparmor: false
devices:
  - /dev/net/tun
privileged:
  - NET_ADMIN
  - SYS_MODULE
map:
  - share:rw
  - media:rw
  - addon_config:rw
ports:
  5030/tcp: 5030
  50300/tcp: 50300
ports_description:
  5030/tcp: "slskd web UI / API (opened by the 'Open Web UI' button)"
  50300/tcp: "Soulseek peer listen port"
webui: "http://[HOST]:[PORT:5030]"
options:
  slsk_username: ""
  slsk_password: ""
  web_username: "slskd"
  web_password: "slskd"
  listen_port: 50300
  shared_directories:
    - "/share/slskd/music"
  downloads_directory: "/share/slskd/downloads"
  incomplete_directory: ""
  upload_slots: 20
  upload_speed_limit: 0
  download_speed_limit: 0
  remote_configuration: false
  diagnostic_level: "Info"
  vpn_enabled: true
  port_forward_method: "natpmp"
  wg_natpmp_gateway: ""
  wg_private_key: ""
  wg_address: ""
  wg_peer_public_key: ""
  wg_peer_endpoint: ""
  wg_allowed_ips: "0.0.0.0/0, ::/0"
schema:
  slsk_username: str
  slsk_password: password
  web_username: str
  web_password: password
  listen_port: port
  shared_directories:
    - str
  downloads_directory: str?
  incomplete_directory: str?
  upload_slots: int(1,1000)
  upload_speed_limit: int(0,)
  download_speed_limit: int(0,)
  remote_configuration: bool
  diagnostic_level: list(None|Warning|Info|Debug)
  vpn_enabled: bool
  port_forward_method: list(none|natpmp)
  wg_natpmp_gateway: str?
  wg_private_key: password?
  wg_address: str?
  wg_peer_public_key: str?
  wg_peer_endpoint: str?
  wg_allowed_ips: str?